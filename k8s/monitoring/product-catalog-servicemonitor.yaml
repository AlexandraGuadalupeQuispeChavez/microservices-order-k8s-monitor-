apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-catalog-monitor
  labels:
    monitoring: "true"
    project: ordersystem
spec:
  selector:
    matchLabels:
      app: product-catalog
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
