apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-management-monitor
  labels:
    monitoring: "true"
    project: ordersystem
spec:
  selector:
    matchLabels:
      app: order-management
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
